<ul class="menu menu-horizontal flex-wrap w-full px-0 [&_ion-icon]:text-lg">
  {{ if site.Params.email }}
  {{ $label := T "email" }}
  <li>
    <a href="mailto:{{ site.Params.email }}" title="{{ $label }}" aria-label="{{ $label }}">
      <ion-icon name="mail"></ion-icon>
    </a>
  </li>
  {{ end }}

  {{ range hugo.Data.socials.socials }}
  <li>
    <a href="{{ .href }}" target="{{ .target }}" title="{{ .title }}">
      <ion-icon name="{{ .icon }}"></ion-icon>
    </a>
  </li>
  {{ end }}
</ul>
